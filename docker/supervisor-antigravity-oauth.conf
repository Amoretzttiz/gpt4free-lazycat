[program:antigravity-oauth-control]
priority=20
command=python /usr/local/libexec/g4f-antigravity-oauth-control
directory=/app
stopasgroup=true
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/antigravity-oauth-control.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=1

name: Build and publish gpt4free

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

# TAG is immutable. Serialize this workflow so two dispatches cannot race while
# publishing the same image name.
concurrency:
  group: gpt4free-ghcr-${{ github.repository }}
  cancel-in-progress: true

env:
  UPSTREAM_REPO: xtekky/gpt4free
  UPSTREAM_SHA: c0402eb5e3eb10529edff84f2ea7ded55643cacf
  IMAGE: ghcr.io/amoretzttiz/gpt4free
  TAG: 20260926-c0402eb

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout packaging
        uses: actions/checkout@v4

      - name: Checkout pinned upstream
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_SHA }}
          path: upstream
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build upstream browser image
        uses: docker/build-push-action@v6
        with:
          context: ./upstream
          file: ./upstream/docker/Dockerfile
          build-args: G4F_VERSION=c0402eb
          load: true
          tags: gpt4free-base:${{ env.TAG }}
          cache-from: type=gha,scope=gpt4free-base
          cache-to: type=gha,mode=max,scope=gpt4free-base

      - name: Build and publish LazyCat wrapper image
        # The upstream build uses load:true, which loads gpt4free-base into the
        # host Docker daemon. A docker-container Buildx builder cannot resolve
        # that local-only base and would try Docker Hub instead, so build the
        # thin wrapper with the host daemon and then push the immutable tag.
        run: |
          docker build \
            --file ./docker/Dockerfile-lazycat \
            --build-arg "BASE_IMAGE=gpt4free-base:${TAG}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.licenses=GPL-3.0-only" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=${TAG}" \
            --label "io.github.gpt4free.upstream.source=https://github.com/${UPSTREAM_REPO}" \
            --label "io.github.gpt4free.upstream.revision=${UPSTREAM_SHA}" \
            --tag "${IMAGE}:${TAG}" \
            .
          docker image inspect "${IMAGE}:${TAG}" \
            --format "{{ json .Config.Labels }}"
          docker push "${IMAGE}:${TAG}"

      - name: Verify image metadata
        run: |
          docker buildx imagetools inspect "${IMAGE}:${TAG}"
